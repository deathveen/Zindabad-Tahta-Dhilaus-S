<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a0c"/>
      <stop offset="70%" stop-color="#140c06"/>
      <stop offset="100%" stop-color="#0a0603"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2"/>
      <stop offset="35%" stop-color="#f1c967"/>
      <stop offset="70%" stop-color="#b88b36"/>
      <stop offset="100%" stop-color="#6e4f16"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Dark Lacquer Coin -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="14"/>
  
  <!-- Inner Sacred Ornamental Ring -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-dasharray="8 6" opacity="0.85"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- 4 Cardinal Gold Accents -->
  <circle cx="256" cy="34" r="6" fill="#f1c967"/>
  <circle cx="256" cy="478" r="6" fill="#f1c967"/>
  <circle cx="34" cy="256" r="6" fill="#f1c967"/>
  <circle cx="478" cy="256" r="6" fill="#f1c967"/>
  
  <!-- Zain Calligraphic Glyph (ز) -->
  <text x="256" y="340" font-family="'Amiri', 'Traditional Arabic', 'Scheherazade', serif" font-size="280" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="url(#goldGlow)">ز</text>
</svg>
