<script>
// Faedah Harian · "Setelan Pabrik Perintah" (kaidah: al-aṣlu fil amri lil wujūb).
// Waktu animasi = waktu VO (detik, VO sudah 1.2x). Koordinat logis 720×1280, dirender 1.5× ke 1080×1920.
const W = 720, H = 1280, SS = 1.5;
const VO_END = 111.75, DURATION = 117.9;   // kartu follow mulai saat Vonya mengajak follow
const cv = document.getElementById('c'); ctx = cv.getContext('2d');
let NT = 0;
</script>
<script src="../engine/lib.js"></script>
<script>
// ---------- naskah (caption mengikuti VO) ----------
const CAPTIONS = [

  [90.9, 93.65, 'berbelok dari wajib menjadi *sunnah*.'],

  [102.5, 106.25, 'Jadi, bahaya banget kan, kalau gampang nge-judge *“ini wajib”*'],
  [106.33, 108.45, 'atau *“ini dosa”*, cuma modal baca sepotong terjemahan,'],

];

// ---------- elemen ----------
const HUKUM = [['WAJIB', '#E2574C'], ['SUNNAH', '#4E8B5F'], ['MUBAH', '#4F86C9']];
// saklar hukum: pos 0 = WAJIB, 1 = SUNNAH, 2 = MUBAH (boleh pecahan saat berputar)
function saklar(cx, cy, s, pos, o = {}) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  // bayangan dan pelat
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(0, 168, 150, 16, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#3A3348'; roundRect(-235, -170, 470, 320, 46); ctx.fill();
  ctx.fillStyle = '#FBF5EA'; roundRect(-225, -160, 450, 300, 40); ctx.fill();
  ctx.strokeStyle = 'rgba(42,34,51,.15)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 30, 150, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  HUKUM.forEach(([lab, col], i) => {
    const a = (-150 + i * 60) * Math.PI / 180, lit = clamp(1 - Math.abs(pos - i) * 1.6) * (o.dim ?? 1);
    const lx = Math.cos(a) * 128, ly = 30 + Math.sin(a) * 128;
    if (lit > 0) { const g = ctx.createRadialGradient(lx, ly, 2, lx, ly, 46); g.addColorStop(0, hexA(col, .55 * lit)); g.addColorStop(1, hexA(col, 0)); ctx.fillStyle = g; ctx.fillRect(lx - 46, ly - 46, 92, 92); }
    ctx.fillStyle = mix('#D8D0C4', col, lit); ctx.beginPath(); ctx.arc(lx, ly, 13, 0, 6.28); ctx.fill();
    ctx.strokeStyle = '#2A2233'; ctx.lineWidth = 3; ctx.stroke();
    ctx.font = '900 21px Inter'; ctx.textAlign = 'center'; ctx.fillStyle = mix('#9A8E86', col, .4 + .6 * lit);
    ctx.fillText(lab, i === 1 ? 0 : Math.cos(a) * 128, i === 1 ? 30 - 128 - 24 : 30 + Math.sin(a) * 128 - 24);
  });
  // kenop + jarum
  const ang = (-150 + pos * 60) * Math.PI / 180;
  ctx.fillStyle = '#2A2233'; ctx.beginPath(); ctx.arc(0, 30, 74, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#4A4260'; ctx.beginPath(); ctx.arc(0, 30, 64, 0, 6.28); ctx.fill();
  ctx.save(); ctx.translate(0, 30); ctx.rotate(ang);
  ctx.fillStyle = AMBER; ctx.beginPath(); ctx.moveTo(98, 0); ctx.lineTo(56, -12); ctx.lineTo(56, 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#6A6084'; roundRect(-8, -60, 16, 120, 8); ctx.fill();
  ctx.restore();
  // lubang kunci di tengah kenop (gembok kecil saat terkunci)
  const lk = o.lock ?? 1;
  ctx.fillStyle = '#1B1724'; ctx.beginPath(); ctx.arc(0, 24, 9, 0, 6.28); ctx.fill(); ctx.fillRect(-4, 24, 8, 18);
  if (lk > 0) {
    ctx.save(); ctx.globalAlpha = lk; ctx.translate(0, 112);
    ctx.strokeStyle = '#9AA0AB'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, -6 - (1 - lk) * 8, 10, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#9AA0AB'; roundRect(-15, -6, 30, 22, 5); ctx.fill(); ctx.restore();
  }
  // label "SETELAN PABRIK" tergantung di dekat WAJIB
  if (o.tag > 0) {
    const sw = Math.sin(NT * 2.2) * .06, tk = backOut(clamp(o.tag));
    ctx.save(); ctx.translate(-190, -150); ctx.rotate(-.18 + sw); ctx.scale(tk, tk);
    ctx.strokeStyle = '#7A6A5C'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-10, -40); ctx.stroke();
    ctx.fillStyle = '#F2B544'; ctx.beginPath(); ctx.moveTo(-90, -40); ctx.lineTo(60, -40); ctx.lineTo(76, -60); ctx.lineTo(60, -80); ctx.lineTo(-90, -80); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2A2233'; ctx.beginPath(); ctx.arc(60, -60, 4, 0, 6.28); ctx.fill();
    ctx.font = '900 17px Inter'; ctx.textAlign = 'center'; ctx.fillText('SETELAN PABRIK', -14, -54);
    ctx.restore();
  }
  ctx.restore();
}
function hexA(c, a) { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; }
// kunci emas bertuliskan qarinah (label boleh lebih dari satu baris)
function kunci(x, y, s, rot, label, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  const g = ctx.createRadialGradient(-70, 0, 4, -70, 0, 90); g.addColorStop(0, 'rgba(255,214,120,.45)'); g.addColorStop(1, 'rgba(255,214,120,0)'); ctx.fillStyle = g; ctx.fillRect(-160, -90, 180, 180);
  ctx.fillStyle = '#F2B544'; ctx.strokeStyle = '#B07A1E'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(-70, 0, 30, 0, 6.28); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#FBF5EA'; ctx.beginPath(); ctx.arc(-70, 0, 12, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#F2B544'; ctx.fillRect(-42, -7, 82, 14); ctx.strokeRect(-42, -7, 82, 14);
  ctx.fillRect(20, 7, 9, 14); ctx.fillRect(32, 7, 8, 10);
  // label
  if (label) {
    const ls = Array.isArray(label) ? label : [label];
    ctx.rotate(-rot); ctx.font = '900 17px Inter'; ctx.textAlign = 'center';
    const w = Math.max(...ls.map(l => ctx.measureText(l).width)) + 26, h = 14 + ls.length * 21;
    ctx.fillStyle = '#2A2233'; roundRect(-70 - w / 2, 38, w, h, 12); ctx.fill();
    ctx.fillStyle = AMBER; ls.forEach((l, i) => ctx.fillText(l, -70, 58 + i * 21));
  }
  ctx.restore();
}
// kartu perintah dengan ikon + stempel hukum
function ikon(kind, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.lineCap = 'round';
  if (kind === 'makan') {
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.ellipse(-8, 14, 40, 13, 0, 0, 6.28); ctx.fill(); ctx.strokeStyle = '#C9BBAA'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#F2B544'; ctx.beginPath(); ctx.ellipse(-8, 6, 26, 12, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#E2574C'; ctx.beginPath(); ctx.arc(-14, 0, 5, 0, 6.28); ctx.arc(-2, -1, 4, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#9FD3E8'; ctx.beginPath(); ctx.moveTo(34, -22); ctx.lineTo(54, -22); ctx.lineTo(51, 20); ctx.lineTo(37, 20); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#5B8FB0'; ctx.stroke();
  } else if (kind === 'jenggot') {
    head(0, -2, 30, { wear: 'kopiah', capColor: '#2B2B33', beard: '#4A3426', mood: .6 });
    ctx.fillStyle = '#4A3426'; ctx.beginPath(); ctx.moveTo(-22, 14); ctx.quadraticCurveTo(0, 52, 22, 14); ctx.quadraticCurveTo(0, 30, -22, 14); ctx.fill();
  } else if (kind === 'sarung') {
    ctx.fillStyle = '#6A4FA0'; ctx.beginPath(); ctx.moveTo(-30, -34); ctx.lineTo(30, -34); ctx.lineTo(34, 18); ctx.lineTo(-34, 18); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; [-14, 4, 22].forEach(v => { ctx.beginPath(); ctx.moveTo(-32, v - 16); ctx.lineTo(32, v - 16); ctx.stroke(); });
    [-12, 12].forEach(v => { ctx.beginPath(); ctx.moveTo(v, -34); ctx.lineTo(v, 18); ctx.stroke(); });
    ctx.fillStyle = '#EFC7A5'; [-14, 14].forEach(v => { ctx.beginPath(); ctx.ellipse(v, 32, 11, 6, 0, 0, 6.28); ctx.fill(); });
    ctx.strokeStyle = '#4E8B5F'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-44, 25); ctx.lineTo(44, 25); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#4E8B5F'; ctx.beginPath(); ctx.moveTo(42, 18); ctx.lineTo(50, 6); ctx.lineTo(34, 6); ctx.fill(); ctx.fillRect(40, -8, 4, 16);
  } else if (kind === 'nikah') {
    ctx.strokeStyle = '#F2B544'; ctx.lineWidth = 7; [[-14, 4], [14, 4]].forEach(([a, b]) => { ctx.beginPath(); ctx.arc(a, b, 20, 0, 6.28); ctx.stroke(); });
    ctx.fillStyle = '#BFE6F5'; ctx.beginPath(); ctx.moveTo(-14, -22); ctx.lineTo(-6, -30); ctx.lineTo(-22, -30); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#F29BB8'; ctx.beginPath(); ctx.moveTo(0, -34); ctx.bezierCurveTo(-10, -46, -22, -36, 0, -22); ctx.bezierCurveTo(22, -36, 10, -46, 0, -34); ctx.fill();
  } else if (kind === 'shalat') {
    sajadah(0, 30, 90); figure(0, 26, .4, { pose: 'stand', robe: '#F4EEE2', wear: 'kopiah', capColor: '#FFFFFF', arms: 'fold' });
  }
  ctx.restore();
}
function kartu(x, y, k, kind, teks, sub, stamp = -1, stampK = 0) {
  if (k <= 0) return;
  const sc = backOut(clamp(k));
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.globalAlpha = clamp(k * 2);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; roundRect(-122, -92, 252, 196, 24); ctx.fill();
  ctx.fillStyle = '#FFFDF7'; roundRect(-126, -98, 252, 196, 24); ctx.fill();
  ctx.strokeStyle = 'rgba(122,106,92,.25)'; ctx.lineWidth = 2; ctx.stroke();
  ikon(kind, 0, -38, 1);
  ctx.textAlign = 'center'; ctx.font = '900 20px Inter'; ctx.fillStyle = '#2A2233'; ctx.fillText(teks, 0, 42);
  ctx.font = '600 13px Inter'; ctx.fillStyle = '#7A6A5C'; ctx.fillText(sub, 0, 66);
  if (stamp >= 0 && stampK > 0) {
    const [lab, col] = HUKUM[stamp], sk = 1 + 1.4 * (1 - easeOut(clamp(stampK)));
    ctx.save(); ctx.translate(70, -84); ctx.rotate(-.18); ctx.scale(sk * .85, sk * .85); ctx.globalAlpha = clamp(stampK * 3);
    ctx.strokeStyle = col; ctx.lineWidth = 4; roundRect(-58, -20, 116, 40, 8); ctx.stroke();
    ctx.fillStyle = '#FFFDF7'; ctx.fill(); ctx.stroke();
    ctx.font = '900 21px Inter'; ctx.fillStyle = col; ctx.fillText(lab, 0, 8); ctx.restore();
  }
  ctx.restore();
}
function rifdaAt(T, x, a, b, arms, from = -1, s = .82) {
  const rin = easeOut(prog(T, a, a + .7)), rout = easeIn(prog(T, b - .5, b));
  if (rin <= 0 || rout >= 1) return;
  const xx = lerp(x + from * 240, x, rin) + from * 260 * rout;
  if (from > 0) { ctx.save(); ctx.translate(xx, 905); ctx.scale(-1, 1); drawRifda(0, 0, s, { arms, talk: talkVO(T), look: .5 }); ctx.restore(); }
  else drawRifda(xx, 905, s, { arms, talk: talkVO(T), look: .5, label: prog(T, a + .4, a + .8) * (1 - prog(T, a + 2.6, a + 3)) });
}
function perpus(T, warm = 0) {
  sky([[0, mix('#F6E9D2', '#FFF1D6', warm)], [1, mix('#E7CFA8', '#F2D7A4', warm)]]);
  // rak buku di latar
  const r = rng(77);
  [[24, 250], [526, 250]].forEach(([x0, y0]) => {
    ctx.fillStyle = 'rgba(122,84,52,.25)'; ctx.fillRect(x0, y0, 170, 560);
    for (let row = 0; row < 5; row++) {
      let x = x0 + 8; const y = y0 + 20 + row * 110;
      while (x < x0 + 160) { const w = 12 + r() * 12, h = 60 + r() * 28; ctx.fillStyle = ['#C98E5A', '#8C5A3C', '#4E8B5F', '#B9A6E0', '#D8B25A'][Math.floor(r() * 5)]; ctx.globalAlpha = .45; ctx.fillRect(x, y + 88 - h, w - 2, h); x += w; }
      ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(122,84,52,.35)'; ctx.fillRect(x0, y + 88, 170, 6);
    }
  });
  particles(T, 'rgba(255,214,140,1)', 22, 33, .3);
  ctx.fillStyle = '#B98552'; ctx.fillRect(0, 884, W, H); ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(0, 884, W, 4);
}

// ---------- adegan ----------
const ST = [13.4, 15.0, 16.9];   // stempel wajib, sunnah, mubah
function S_perintah(T) {
  perpus(T);
  headline('SAMA-SAMA PERINTAH', ['TAPI KOK BEDA?'], T, 11.4, 0, { y: 150, size: 54, bigColor: '#8C3B2E', smallColor: '#7A6A5C' });
  const K = [[2.2, 'makan', 'Makan & minumlah', 'QS. Al-A‘raf: 31', 2, ST[2]], [6.5, 'jenggot', 'Peliharalah jenggot', 'HR. Al-Bukhari 5893', 0, ST[0]],
    [7.9, 'sarung', 'Angkat sarungmu', 'HR. Abu Dawud 4084', 1, ST[1]], [10.0, 'nikah', 'Menikahlah', 'HR. Al-Bukhari 5066', 1, ST[1] + .35]];
  K.forEach(([a, kind, t1, t2, st, sa], i) => {
    const x = 214 + (i % 2) * 292, y = 375 + Math.floor(i / 2) * 230 + Math.sin(T * 1.3 + i) * 4;
    kartu(x, y, prog(T, a, a + .5), kind, t1, t2, st, prog(T, sa, sa + .3));
  });
  // "padahal sama-sama perintah": label fi'il amr menyala di semua kartu
  const fk = easeOut(prog(T, 19.3, 19.9));
  if (fk > 0) {
    ctx.save(); ctx.globalAlpha = fk; ctx.textAlign = 'center';
    ctx.fillStyle = '#2A2233'; roundRect(W / 2 - 150, 812 - (1 - fk) * 10, 300, 46, 23); ctx.fill();
    ctx.font = '900 20px Inter'; ctx.fillStyle = AMBER; ctx.fillText('SEMUA = FI‘IL AMR', W / 2, 842 - (1 - fk) * 10); ctx.restore();
  }
  // tanda tanya besar
  // Rifda membuka dengan pertanyaan
  const rin = easeOut(prog(T, .3, 1.1)), rout = easeIn(prog(T, 1.9, 2.3));
  if (rout < 1) drawRifda(lerp(-140, 150, rin) - rout * 300, 905, 1.0, { arms: 'wave', talk: talkVO(T), label: prog(T, .8, 1.2), look: .5 });
  rifdaAt(T, 92, 11.2, 23.0, 'point');
}
function S_kaidah(T) {
  perpus(T, .5);
  const g = ctx.createRadialGradient(W / 2, 400, 30, W / 2, 400, 460); g.addColorStop(0, 'rgba(255,236,180,.6)'); g.addColorStop(1, 'rgba(255,236,180,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  rays(W / 2, 400, 60, 620, 14, .35 * prog(T, 28.4, 29.4), '255,226,150', T * .08);
  headline('RAHASIANYA DI', ['KAIDAH PERTAMA', 'USHUL FIQIH'], T, 23.5, 0, { y: 150, size: 46, bigColor: B.daunGelap, smallColor: '#7A6A5C' });
  dalilCard(T, 28.3, 'KAIDAH USHUL FIQIH', ['الأَصْلُ فِي الأَمْرِ لِلْوُجُوبِ'], ['“Hukum asal sebuah perintah', 'adalah wajib.”'], 'Pendapat jumhur ulama ushul fiqih',
    { y: 360, h: 300, arabSize: 50, bg: 'rgba(35,69,54,.95)' });
  rifdaAt(T, 92, 23.6, 31.5, 'chest');
}
// posisi saklar (0 wajib .. 2 mubah) di adegan saklar
function posSaklar(T) {
  if (T < 52.4) return 0;
  const a = easeInOut(prog(T, 52.4, 53.1)), b = easeInOut(prog(T, 53.5, 54.1));
  return a + b;
}
function S_saklar(T) {
  perpus(T, .2);
  headline('SETIAP FI‘IL AMR', ['SETELAN PABRIK:', 'WAJIB'], T, 31.8, 47.4, { y: 140, size: 46, bigColor: '#B23E33', smallColor: '#7A6A5C' });
  headline('KECUALI ADA', ['QARINAH'], T, 47.6, 0, { y: 140, size: 58, bigColor: '#B07A1E', smallColor: '#7A6A5C' });
  const sk = backOut(prog(T, 31.8, 32.5)), lockOpen = easeOut(prog(T, 50.2, 50.8));
  const flash = prog(T, 41.6, 42.0) * (1 - prog(T, 42.6, 43.4));
  ctx.save(); ctx.translate(410, 690); ctx.scale(sk, sk);
  if (flash > 0) rays(0, 30, 60, 330, 14, .6 * flash, '255,140,120', T * .2);
  saklar(0, 0, .95, posSaklar(T), { tag: prog(T, 35.2, 35.8), lock: 1 - lockOpen });
  ctx.restore();
  // kartu "dirikanlah shalat" turun ke saklar
  const ck = easeOut(prog(T, 38.6, 39.4)), cout = easeIn(prog(T, 44.4, 45.0));
  if (ck > 0 && cout < 1) {
    ctx.save(); ctx.globalAlpha = 1 - cout; kartu(410, lerp(300, 390, ck) - cout * 60, ck, 'shalat', 'وَأَقِيمُوا الصَّلَاةَ', '“Dirikanlah shalat”', 0, prog(T, 41.6, 41.9)); ctx.restore();
  }
  // kunci QARINAH terbang lalu masuk ke lubang kunci
  const kin = easeInOut(prog(T, 48.4, 49.8)), kout = prog(T, 54.4, 54.9);
  if (kin > 0) kunci(lerp(780, 410 + 70 * .95, kin), lerp(420, 712, kin), .9, lerp(-.6, 0, kin) + easeInOut(prog(T, 49.8, 50.4)) * 1.2, ['QARINAH', '(dalil / indikasi)'], 1 - kout);
  rifdaAt(T, 92, 31.9, 54.8, 'point');
}
function S_isbal(T) {
  const red = easeInOut(prog(T, 61.3, 62.4));
  sky([[0, mix('#F3E6D6', '#3A1F24', red)], [1, mix('#E2CFB6', '#5A2A2A', red)]]);
  particles(T, red > .5 ? 'rgba(255,140,110,1)' : 'rgba(255,214,140,1)', 18, 7, .3);
  ctx.fillStyle = mix('#B98552', '#2A1416', red); ctx.fillRect(0, 884, W, H);
  headline('CONTOH:', ['ISBAL'], T, 55.1, 61.0, { y: 150, size: 70, bigColor: '#8C3B2E', smallColor: '#7A6A5C' });
