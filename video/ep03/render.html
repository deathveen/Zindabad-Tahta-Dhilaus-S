<script>
// ---------- naskah (VO dipadatkan & dipercepat ke ±200 kata/menit) ----------
const CAPTIONS = [

// ---------- elemen ----------
// payung besar = hukum yang bersifat umum. o: open 0..1, gap 0..1 (satu panel terangkat rapi), glow 0..1
function payung(cx, rimY, r, o = {}) {
  const open = o.open ?? 1, rr = r * lerp(.18, 1, open), hh = r * lerp(.75, .55, open), n = 8;
  const apexY = rimY - hh, cols = o.cols || [B.daun, '#F4EEDF'];
  if (o.glow) {
    const g = ctx.createRadialGradient(cx, rimY + 40, 20, cx, rimY + 40, r * 1.5);
    g.addColorStop(0, `rgba(255,226,150,${.5 * o.glow})`); g.addColorStop(1, 'rgba(255,226,150,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - r * 1.6, apexY - r * .4, r * 3.2, r * 2.6);
  }
  // gagang
  const stickB = rimY + (o.stick ?? r * .95);
  ctx.strokeStyle = '#5A3B2A'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, apexY); ctx.lineTo(cx, stickB); ctx.arc(cx + 16, stickB, 16, Math.PI, 0, true); ctx.stroke();
  // kanopi
  const xs = [...Array(n + 1)].map((_, i) => cx - rr + 2 * rr * i / n);
  const dome = () => {
    ctx.beginPath(); ctx.moveTo(cx - rr, rimY); ctx.ellipse(cx, rimY, rr, hh, 0, Math.PI, 0);
    for (let i = n; i > 0; i--) ctx.quadraticCurveTo((xs[i] + xs[i - 1]) / 2, rimY - 16 * open, xs[i - 1], rimY);
    ctx.closePath();
  };
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8; dome(); ctx.fillStyle = 'rgba(0,0,0,.01)'; ctx.fill(); ctx.restore();
  const gi = o.gapIdx ?? 5, gk = o.gap || 0;
  const wedge = i => { ctx.beginPath(); ctx.moveTo(cx, apexY - 4); ctx.lineTo(xs[i] + (xs[i] - cx) * .02, rimY + 4); ctx.lineTo(xs[i + 1] + (xs[i + 1] - cx) * .02, rimY + 4); ctx.closePath(); };
  ctx.save(); dome(); ctx.clip();
  for (let i = 0; i < n; i++) {
    if (gk > 0 && i === gi) continue;
    wedge(i); ctx.fillStyle = cols[i % 2]; ctx.fill();
  }
  // kilau
  const sh = ctx.createLinearGradient(0, apexY, 0, rimY); sh.addColorStop(0, 'rgba(255,255,255,.28)'); sh.addColorStop(1, 'rgba(0,0,0,.12)');
  ctx.fillStyle = sh; ctx.fillRect(cx - rr, apexY, 2 * rr, hh + 6);
  if (o.glow) { ctx.fillStyle = `rgba(255,236,170,${.35 * o.glow})`; ctx.fillRect(cx - rr, apexY, 2 * rr, hh + 6); }
  ctx.restore();
  ctx.save(); dome(); ctx.strokeStyle = 'rgba(30,40,30,.35)'; ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();
  ctx.fillStyle = '#5A3B2A'; ctx.beginPath(); ctx.arc(cx, apexY - 6, 6, 0, 6.28); ctx.fill();
  // celah resmi dari dalil: panel terangkat seperti pintu, bertepi cahaya
  if (gk > 0) {
    ctx.save(); wedge(gi); ctx.setLineDash([7, 6]); ctx.strokeStyle = `rgba(255,214,110,${gk})`; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
    const mx = (xs[gi] + xs[gi + 1]) / 2;
    ctx.save(); ctx.globalAlpha = 1 - .3 * gk; ctx.translate(cx, apexY); ctx.rotate(-.25 * gk * Math.sign(mx - cx || 1)); ctx.translate(-cx, -apexY - 60 * gk);
    wedge(gi); ctx.fillStyle = cols[gi % 2]; ctx.fill(); ctx.strokeStyle = AMBER; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  }
  if (o.label) {
    ctx.save(); ctx.globalAlpha = o.labelK ?? 1; ctx.font = '900 30px Inter'; ctx.textAlign = 'center'; ctx.fillStyle = '#FFFFFF';
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 8; ctx.fillText(o.label, cx, rimY - hh * .38); ctx.restore();
  }
  return { apexY, xs };
}
function gunting(x, y, s, rot, label, openK = .4, alpha = 1) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  [-1, 1].forEach(d => {
    ctx.save(); ctx.rotate(d * openK * .35);
    ctx.fillStyle = '#D9DEE6'; ctx.strokeStyle = '#7F8794'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(46, d * -6, 92, 0); ctx.quadraticCurveTo(46, d * 8, 0, d * 9); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#E2574C'; ctx.lineWidth = 7; ctx.beginPath(); ctx.ellipse(-30, d * 14, 17, 11, d * .3, 0, 6.28); ctx.stroke();
    ctx.restore();
  });
  ctx.fillStyle = '#5A5F6A'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, 6.28); ctx.fill();
  if (label) {
    ctx.rotate(-rot); ctx.fillStyle = '#2A2233'; roundRect(-58, 34, 116, 32, 16); ctx.fill();
    ctx.font = '800 17px Inter'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(label, 0, 56);
  }
  ctx.restore();
}
// gelembung chat / stiker yang muncul berpegas
function bubble(x, y, text, k, o = {}) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); const sc = backOut(clamp(k)); ctx.scale(sc, sc); ctx.globalAlpha = clamp(k * 2) * (o.alpha ?? 1);
  setFont(o.size || 24, 800); const w = ctx.measureText(text).width + 44, h = (o.size || 24) + 30;
  ctx.fillStyle = o.bg || '#FFFFFF'; ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
  roundRect(-w / 2, -h / 2, w, h, h / 2); ctx.fill();
  ctx.beginPath(); const tx = (o.tail || 0) * w * .35; ctx.moveTo(tx - 10, h / 2 - 2); ctx.lineTo(tx + 4 * Math.sign(o.tail || 1), h / 2 + 16); ctx.lineTo(tx + 12, h / 2 - 2); ctx.fill();
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; ctx.fillStyle = o.fg || '#2A2233'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 1);
  ctx.restore();
}
function tag(x, y, text, k, bg = B.daunGelap, fg = '#fff', size = 20) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(backOut(clamp(k)), backOut(clamp(k))); ctx.globalAlpha *= clamp(k * 2);
  setFont(size, 800); const w = ctx.measureText(text).width + 34;
  ctx.fillStyle = bg; roundRect(-w / 2, -size * .9, w, size * 1.8, size * .9); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 1); ctx.restore();
}
// kerumunan di bawah payung: zaman dulu (siluet) sampai zaman sekarang
const CROWD = [
  { x: 210, s: .74, o: { robe: '#3A3550', sil: '#2E2A44', rim: 1, wear: 'sorban', beard: '#2E2A44' } },
  { x: 292, s: .7, o: { robe: '#3A3550', sil: '#2E2A44', rim: 1, wear: 'hijab', hijab: '#2E2A44' } },
  { x: 378, s: .76, o: { robe: '#C9B79A', wear: 'sorban', beard: '#E8E2D6', mood: .6 } },
  { x: 460, s: .62, o: { robe: '#F2B544', wear: 'kopiah', capColor: '#FFFFFF', mood: 1 } },
  { x: 540, s: .74, o: { robe: '#9DB4D8', wear: 'hijab', hijab: '#6E8FC4', mood: .8 } },
  { dafa: 1, x: 622, s: .76 },
];
function crowd(T, gy, a, o = {}) {
  CROWD.forEach((c, i) => {
    const k = backOut(prog(T, a + i * .12, a + i * .12 + .45)); if (k <= 0) return;
    const bob = Math.sin(T * 3 + i) * 1.5, x = c.x + (o.dx || 0);
    ctx.save(); ctx.translate(x, gy + (1 - k) * 30 + bob); ctx.scale(k, k);
    if (c.dafa) drawDafa(0, 0, c.s, { t: T, mood: o.dafaMood ?? .8, look: -.3, sad: o.dafaSad || 0 });
    else figure(0, 0, c.s, { pose: 'stand', arms: 'rest', ...c.o });
    ctx.restore();
  });
}
function mendung(T, k = 0) {
  sky([[0, mix('#3B3560', '#2A2346', k)], [1, mix('#8A78A8', '#4A3E68', k)]]);
  const r = rng(7);
  for (let i = 0; i < 5; i++) {
    const x = ((r() * 900 + T * (8 + r() * 10)) % 1000) - 140, y = 120 + r() * 380, w = 140 + r() * 120;
    ctx.fillStyle = `rgba(255,255,255,${.06 + r() * .05})`; ctx.beginPath(); ctx.ellipse(x, y, w, w * .28, 0, 0, 6.28); ctx.fill();
  }
}
function lantai(y, c) { ctx.fillStyle = c; ctx.fillRect(0, y, W, H - y); ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(0, y, W, 3); }

// ---------- adegan ----------
function S_hook(T) {
  mendung(T);
  lantai(905, '#2E2848');
  headline('PERNAH', ['GAK SIH?'], T, .25, 3.6, { y: 150, size: 74 });
  bubble(470, 470, 'Yuk, jangan lupa aturan agama!', prog(T, .9, 1.4), { size: 21, tail: -1 });
  bubble(500, 575, 'Ah, nanti aja deh…', prog(T, 2.7, 3.1), { size: 22, bg: '#FFE3A3', tail: 1 });
  const rin = easeOut(prog(T, .1, .8));
  drawRifda(lerp(-140, 170, rin), 905, 1.1, { arms: T < 2.6 ? 'point' : 'chest', talk: talkVO(T), label: prog(T, .6, 1) * (1 - prog(T, 3, 3.4)), look: .5 });
}

function papanAturan(T, cutK, fallK) {
  // papan "ATURAN AGAMA"; sudut kanan bawah terpotong oleh gunting "alasanku"
  const x0 = 150, y0 = 190, w = 420, h = 170, cx0 = x0 + w - 110, cy0 = y0 + h;
  const board = () => { ctx.beginPath(); ctx.moveTo(x0 + 18, y0); ctx.lineTo(x0 + w - 18, y0); ctx.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + 18);
    if (cutK) { ctx.lineTo(x0 + w, y0 + h - 70); ctx.lineTo(cx0, cy0); } else { ctx.lineTo(x0 + w, y0 + h - 18); ctx.quadraticCurveTo(x0 + w, y0 + h, x0 + w - 18, y0 + h); }
    ctx.lineTo(x0 + 18, y0 + h); ctx.quadraticCurveTo(x0, y0 + h, x0, y0 + h - 18); ctx.lineTo(x0, y0 + 18); ctx.quadraticCurveTo(x0, y0, x0 + 18, y0); ctx.closePath(); };
  const paint = () => {
    ctx.fillStyle = '#FBF5EA'; ctx.fillRect(x0 - 10, y0 - 10, w + 20, h + 20);
    ctx.font = '900 34px Inter'; ctx.fillStyle = B.daunGelap; ctx.textAlign = 'center'; ctx.fillText('ATURAN AGAMA', x0 + w / 2, y0 + 56);
    ctx.fillStyle = '#D9CDB8'; [0, 1, 2].forEach(i => { roundRect(x0 + 50, y0 + 82 + i * 24, w - 100 - i * 40, 10, 5); ctx.fill(); });
  };
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 16; board(); ctx.fillStyle = '#FBF5EA'; ctx.fill(); ctx.restore();
  ctx.save(); board(); ctx.clip(); paint(); ctx.restore();
  // tali gantungan
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x0 + 60, y0); ctx.lineTo(x0 + 120, 60); ctx.lineTo(x0 + w - 60, y0); ctx.stroke();
  if (cutK && fallK < 1) {
    const fy = easeIn(fallK) * 700, fr = fallK * 2.2;
    ctx.save(); ctx.translate(cx0 + 55, cy0 - 35 + fy); ctx.rotate(fr); ctx.translate(-(cx0 + 55), -(cy0 - 35));
    ctx.beginPath(); ctx.moveTo(x0 + w, y0 + h - 70); ctx.lineTo(x0 + w, y0 + h - 18); ctx.quadraticCurveTo(x0 + w, y0 + h, x0 + w - 18, y0 + h); ctx.lineTo(cx0, cy0); ctx.closePath();
    ctx.fillStyle = '#FBF5EA'; ctx.fill(); ctx.restore();
  }
}
function S_alasan(T) {
  const gloom = prog(T, 12.6, 14);
  mendung(T, gloom * .8);
  lantai(880, mix('#3A3258', '#262038', gloom));
  const cutK = T > 11.95 ? 1 : 0;
  papanAturan(T, cutK, prog(T, 12.0, 13.4));
  // stiker alasan
  const out = 1 - prog(T, 9.5, 9.9);
  bubble(250, 470, '“Itu aturan zaman dulu…”', prog(T, 3.9, 4.4), { size: 23, tail: 1, alpha: out });
  bubble(470, 575, '“Kondisiku beda…”', prog(T, 7.2, 7.7), { size: 24, bg: '#FFE3A3', tail: -1, alpha: out });
  // gunting "alasanku" memotong sudut papan
  const gin = easeOut(prog(T, 9.9, 10.9)), snip = prog(T, 11.2, 11.95), gout = prog(T, 12.6, 13.2);
  if (gin > 0) {
    const gx = lerp(760, 548, gin), gy = lerp(650, 330, gin);
    gunting(gx + gout * 220, gy - gout * 120, 1.05, 2.6, 'alasanku', .45 * (1 - Math.abs(Math.sin(snip * Math.PI * 2))), 1 - gout);
  }
  // Dafa: mengibas, lalu bingung
  const shrug = T > 3.9 && T < 9.6;
  drawDafa(330, 880, .95, { t: T, mood: lerp(.5, -.6, gloom), sad: gloom, arms: shrug ? 'wave' : T > 9.9 && T < 12.6 ? 'point' : 'rest', look: T > 9.9 && T < 12.6 ? .8 : 0, talk: shrug ? .3 * Math.abs(Math.sin(T * 9)) : 0 });
  // tanda tanya berputar
  if (gloom > 0) for (let i = 0; i < 3; i++) {
    const a = T * 2 + i * 2.09, k = backOut(prog(T, 12.9 + i * .15, 13.3 + i * .15));
    ctx.save(); ctx.globalAlpha = clamp(k); ctx.font = '900 44px Inter'; ctx.fillStyle = '#FFE3A3'; ctx.textAlign = 'center';
    ctx.translate(330 + Math.cos(a) * 80, 660 + Math.sin(a) * 22); ctx.scale(k, k); ctx.fillText('?', 0, 0); ctx.restore();
  }
}

function S_payung(T) {
  // 14.95–24.65: payung raksasa menaungi semua orang; sempat mengecil ("kasus tertentu?"), lalu kembali penuh
  sky([[0, '#2A3A5E'], [.6, '#4E6A8C'], [1, '#7F9BB0']]);
  particles(T, 'rgba(255,255,255,1)', 18, 31, .3);
  lantai(880, '#2C3E50');
  const shrink = easeInOut(prog(T, 18.9, 19.6)) * (1 - easeOut(prog(T, 21.5, 22.1)));
  const r = lerp(330, 150, shrink), cx = lerp(410, 622, shrink);
  const open = backOut(prog(T, 15.0, 15.8));
  payung(cx, 560, r, { open, stick: 240, glow: .35 + .5 * prog(T, 21.6, 22.3) });
  crowd(T, 880, 15.4, { dafaMood: .8 });
  if (T > 21.5) tag(410, 925, 'zaman dulu · zaman sekarang · siapa saja', prog(T, 22.2, 22.6), B.daunGelap, '#fff', 18);
  else { tag(250, 925, 'zaman dulu', prog(T, 16.2, 16.6), '#2E2A44'); tag(540, 925, 'zaman sekarang', prog(T, 16.5, 16.9), B.daunGelap); }
  // tanda tanya saat payung mengecil
  const q = backOut(prog(T, 19.4, 19.8)) * (1 - prog(T, 21.3, 21.6));
  if (q > 0) { ctx.save(); ctx.globalAlpha = clamp(q); ctx.font = '900 70px Inter'; ctx.fillStyle = AMBER; ctx.textAlign = 'center'; ctx.translate(300, 470); ctx.scale(q, q); ctx.fillText('?', 0, 0); ctx.restore(); }
  headline('BERLAKU UNTUK', ['SEMUA ORANG?'], T, 15.4, 18.9, { y: 140, size: 62 });
  headline('ATAU CUMA', ['KASUS TERTENTU?'], T, 18.9, 21.5, { y: 140, size: 58 });
  headline('ISLAM PUNYA', ['PRINSIP JELAS'], T, 21.6, 0, { y: 140, size: 62 });
  rifdaCorner(T, 21.7, 24.9, 'point');
}

function S_kaidah(T) {
  sky([[0, '#10291F'], [1, '#234536']]);
  const g = ctx.createRadialGradient(W / 2, 420, 40, W / 2, 420, 520); g.addColorStop(0, 'rgba(242,181,68,.16)'); g.addColorStop(1, 'rgba(242,181,68,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  particles(T, 'rgba(255,230,170,1)', 22, 61, .4);
  headline('DI DALAM ILMU', ['USHUL FIQIH'], T, 24.75, 26.5, { y: 300, size: 70 });
  dalilCard(T, 26.3, 'KAIDAH USHUL FIQH', ['الْعَامُّ يَبْقَى عَلَى عُمُومِهِ', 'مَا لَمْ يَرِدْ دَلِيلُ التَّخْصِيصِ'],
    ['“Dalil yang bersifat umum tetap berlaku', 'pada keumumannya, selama tidak ada', 'dalil lain yang mengkhususkannya.”'], 'Kaidah tentang lafaz umum (al-‘ām)', { y: 170, h: 372, arabSize: 40, bg: 'rgba(12,30,22,.94)' });
  // garis bawah baris Arab yang sedang dibaca
  const line = T < 27.9 ? 0 : 1, uk = T < 29.7 ? easeOut(prog(T, line ? 27.9 : 26.5, line ? 29.5 : 27.85)) : 0;
  if (uk > 0) { ctx.fillStyle = 'rgba(242,181,68,.75)'; const y = 170 + 118 + line * 40 * 1.35 + 12; ctx.fillRect(W / 2 + 230 - 460 * uk, y, 460 * uk, 3); }
  // diagram mini: payung "UMUM", celah resmi hanya dari dalil khusus
  const mk = backOut(prog(T, 29.8, 30.4));
  if (mk > 0) {
    ctx.save(); ctx.translate(470, 790); ctx.scale(mk, mk); ctx.translate(-470, -790);
    payung(470, 790, 150, { open: 1, stick: 110, gap: easeOut(prog(T, 33.1, 33.8)), gapIdx: 6, label: 'UMUM' });
    ctx.restore();
    tag(470, 640, 'dalil khusus', prog(T, 33.4, 33.8), AMBER, B.daunGelap, 18);
  }

const BADGES = [['✓ perintah', 39.1, 190, '#4E8B5F'], ['✕ larangan', 39.9, 360, '#B5473A'], ['★ janji pahala', 40.5, 540, '#C98A1E']];

  sky([[0, '#FFF1DC'], [.7, '#F9DDBC'], [1, '#F2C9A0']]);

  BADGES.forEach(([l, a, x, c]) => {

  });

  [['siapa saja', 41.6, 150], ['kapan saja', 43.5, 360], ['di mana saja', 44.2, 570]].forEach(([l, a, x]) => {
    ctx.save(); ctx.globalAlpha = pout; tag(x, 175, l, prog(T, a, a + .4), B.daunGelap, '#fff', 22); ctx.restore();

    const fly = easeIn(prog(T, a, a + .55)), bounce = prog(T, a + .55, a + 1.4);

    const y = bounce > 0 ? hy - Math.sin(bounce * Math.PI) * 120 + bounce * 260 : lerp(160, hy, fly);

    if (bounce > 0 && bounce < .4) { ctx.save(); ctx.globalAlpha = 1 - bounce / .4; rays(hx, hy + 10, 6, 60, 8, 1, '255,214,110', 0); ctx.restore(); }
  });
  headline('TIDAK BOLEH', ['DIKECUALIKAN', 'SEMAUNYA'], T, 45.2, 48.9, { y: 120, size: 54, bigColor: '#B5473A', smallColor: '#7A6A5C' });

  const warm = easeInOut(prog(T, 63.2, 65.5));
