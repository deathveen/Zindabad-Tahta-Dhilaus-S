// ---------- elemen episode ----------
const HIJAU = '#4E8B5F', MERAH = '#E2574C', EMAS = '#F2B544';
function ruang(T, warm = 0) {
  sky([[0, mix('#EAF2EC', '#FFF1DA', warm)], [1, mix('#CFE3D6', '#F4D9AE', warm)]]);
  particles(T, 'rgba(255,214,140,1)', 18, 43, .3);
  ctx.fillStyle = mix('#7FA98A', '#C98E5A', warm); ctx.fillRect(0, 884, W, H); ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(0, 884, W, 4);
}
// struk amal: kertas berbaris dengan tepi bawah bergerigi; cap SAH/BATAL di atasnya
function struk(x, y, s, k, judul, baris, cap) {
  if (k <= 0) return; const sc = backOut(clamp(k)) * s;
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.globalAlpha = clamp(k * 2);
  ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.beginPath(); ctx.moveTo(-96, -146); ctx.lineTo(104, -146); ctx.lineTo(104, 146); for (let i = 0; i <= 10; i++) ctx.lineTo(104 - i * 20, 146 + (i % 2 ? 12 : 0)); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FFFDF7'; ctx.beginPath(); ctx.moveTo(-100, -150); ctx.lineTo(100, -150); ctx.lineTo(100, 140); for (let i = 0; i <= 10; i++) ctx.lineTo(100 - i * 20, 140 + (i % 2 ? 12 : 0)); ctx.closePath(); ctx.fill();
  ctx.textAlign = 'center'; ctx.font = '900 20px Inter'; ctx.fillStyle = '#2A2233'; ctx.fillText(judul, 0, -110);
  ctx.strokeStyle = 'rgba(42,34,51,.3)'; ctx.setLineDash([5, 5]); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-80, -94); ctx.lineTo(80, -94); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = '700 15px Inter'; ctx.fillStyle = '#7A6A5C'; ctx.textAlign = 'left'; (baris || []).forEach((l, i) => ctx.fillText(l, -80, -64 + i * 26));
  ctx.fillStyle = 'rgba(42,34,51,.15)'; for (let i = 0; i < 3; i++) ctx.fillRect(-80, 30 + i * 22, i === 2 ? 90 : 160, 8);
  ctx.restore();
  if (cap) stempel(x, y + 10 * s, cap[0], cap[1], cap[2], 34 * s, -.16);
}
function hpGame(x, y, s, cheat) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#2A2233'; roundRect(-150, -84, 300, 168, 22); ctx.fill(); ctx.fillStyle = '#3B6FA8'; roundRect(-136, -72, 272, 144, 12); ctx.fill();
  ctx.fillStyle = '#7FC36B'; ctx.fillRect(-136, 30, 272, 42); ctx.fillStyle = '#F2B544'; ctx.beginPath(); ctx.arc(-60, 10, 16, 0, 6.28); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)'; roundRect(-120, -60, 150, 16, 8); ctx.fill(); ctx.fillStyle = '#4E8B5F'; roundRect(-120, -60, 150 * (1 - cheat), 16, 8); ctx.fill();
  ctx.font = '800 12px Inter'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText('PROGRESS', 40, -48);

}

  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3; [0, 1, 2].forEach(i => { const p = ((NT * .8 + i / 3) % 1); ctx.globalAlpha = 1 - p; ctx.beginPath(); ctx.arc(83, -110, 12 + p * 50, -.8, .8); ctx.stroke(); }); ctx.globalAlpha = 1;

// ---------- adegan ----------
function latarHook(T, merah = 0) {
  sky([[0, mix('#14324A', '#3A1F2A', merah)], [1, mix('#1E4A5E', '#5A2A2A', merah)]]);
  rays(W / 2, 420, 40, 900, 18, .22 + .3 * hookPunch(T), merah > .5 ? '255,140,120' : '120,200,255', T * .15);
  particles(T, 'rgba(220,235,255,1)', 22, 5, .8);
  ctx.fillStyle = mix('#10283A', '#2A1416', merah); ctx.fillRect(0, 884, W, H);
}
function S_hook(T) {
  latarHook(T, prog(T, 6.8, 7.1));
  const hk = backOut(prog(T, .42, .75));
  if (hk > 0) {
    ctx.save(); ctx.translate(W / 2, 200); ctx.scale(hk, hk);
    ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 20;
    ctx.font = '900 30px Inter'; ctx.fillStyle = '#fff'; ctx.fillText('UDAH CAPEK-CAPEK,', 0, -36);
    ctx.font = '900 76px Inter'; ctx.fillStyle = AMBER; ctx.fillText('AUTO BATAL?', 0, 48); ctx.restore();
  }
  struk(W / 2 + 120, 560, 1.0, prog(T, 2.0, 2.4), 'STRUK AMAL', ['usaha: 100%', 'capek: banget'], [prog(T, 6.9, 7.15), 'BATAL', MERAH]);
  const sweat = T > 1.5 && T < 6.8;
  drawDafa(170, 884, .95, { t: T, mood: T > 6.9 ? -.8 : .2, sad: prog(T, 7.0, 7.5), arms: sweat ? 'lift' : 'rest', up: 1, target: 'hold' });
  if (sweat) { ctx.fillStyle = '#9FD3E8'; [0, 1].forEach(i => { const p = ((T * 1.2 + i * .5) % 1); ctx.globalAlpha = 1 - p; ctx.beginPath(); ctx.ellipse(210 + i * 14, 700 + p * 40, 5, 8, 0, 0, 6.28); ctx.fill(); }); ctx.globalAlpha = 1; }
}

function S_game(T) {

function S_kaidah(T) {

  headline('DALAM USHUL FIQIH', ['KAIDAH KEDELAPAN'], T, 29.8, 0, { y: 150, size: 52, bigColor: B.daunGelap, smallColor: '#7A6A5C' });
  dalilCard(T, 33.4, 'KAIDAH USHUL FIQIH', ['الأَصْلُ فِي النَّهْيِ الْمُطْلَقِ يَقْتَضِي', 'الْفَسَادَ فِي الْعِبَادَاتِ وَالْمُعَامَلَاتِ'], ['“Hukum asal larangan yang mutlak: membuat', 'ibadah dan muamalah rusak (tidak sah).”'], 'Kaidah ushul fiqih',

  pil(W / 2, 460, prog(T, 45.6, 45.9) * (1 - prog(T, 58.8, 59.1)), 'LARANGAN DI INTINYA', '#8C3B2E', '#fff', 20);
  [[140, 49.2, 'PUASA', ['hari raya', 'Idul Fitri'], 50.3], [360, 51.5, 'RIBA', ['bunga', 'pinjaman'], 52.6], [580, 52.8, 'MIRAS', ['jual beli', 'khamr'], 53.8]].forEach(([x, a, j, b, c]) => struk(x, 650, .62, prog(T, a, a + .35), j, b, [prog(T, c, c + .25), 'BATAL', MERAH]));
  pil(W / 2, 860, prog(T, 54.4, 54.7) * (1 - prog(T, 58.8, 59.1)), 'jam berapa pun → batal dari awal', '#2A2233', '#fff', 19);
  const pt = backOut(prog(T, 59.08, 59.34));

  pil(W / 2, 380, prog(T, 60.7, 61.0), 'kata kuncinya: HUKUM ASAL', HIJAU, '#fff', 22);
}
function S_jumat(T) {

  dalilCard(T, 63.6, 'QS. AL-JUMU‘AH: 9', ['إِذَا نُودِيَ لِلصَّلَاةِ مِنْ يَوْمِ الْجُمُعَةِ', 'فَاسْعَوْا إِلَىٰ ذِكْرِ اللَّهِ وَذَرُوا الْبَيْعَ'], ['“… apabila diseru untuk menunaikan shalat Jum’at,', 'maka bersegeralah kamu kepada mengingat Allah', 'dan tinggalkanlah jual beli …”'], 'Terjemahan Kemenag RI',

// efek suara (detik video) untuk audio.py
function sfxEvents() {
  const ev = [], add = (t, type, extra = {}) => ev.push({ t: +t.toFixed(3), type, ...extra });
