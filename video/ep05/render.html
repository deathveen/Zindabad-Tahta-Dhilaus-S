<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../karakter/karakter.js"></script>
<script src="../branding/brand.js"></script>
<script src="vo_env.js"></script>
<script>
// Faedah Harian · "Jembatan Kewajiban" (kaidah: mā lā yatimmul wājibu illā bihī fahuwa wājib).
// Waktu animasi = waktu VO (detik; VO sudah 1.25x dan jeda panjang dipotong). Koordinat logis 720×1280, dirender 1.5× ke 1080×1920.
const W = 720, H = 1280, SS = 1.5;
const VO_END = 58.38, DURATION = 64.7;   // kartu follow mulai saat Vonya mengajak follow
const HOOK_HITS = [0.42, 9.8, 11.74], HOOK_END = 12.5;   // hook: hantaman pembuka, "jadi wajib", "kok bisa?"
const cv = document.getElementById('c'); ctx = cv.getContext('2d');
let NT = 0;
</script>
<script src="../engine/lib.js"></script>
<script>
// ---------- naskah (caption mengikuti VO) ----------
const CAPTIONS = [
  [0.78, 2.64, 'Jangan *samakan* hal mubah yang biasa saja'],
  [2.76, 5.6, 'dengan hal mubah yang jadi *jalan menuju kewajiban*.'],
  [5.7, 7.6, 'Banyak yang ngira *melebihkan basuhan wudhu* di atas siku,'],
  [7.6, 9.44, 'atau *belajar ilmu dagang*…'],
  [9.8, 11.62, 'Padahal hukumnya bisa berubah jadi *wajib*.'],
  [11.74, 12.48, '*Kok bisa?*'],
  [12.6, 15.12, 'Rahasianya ada di *kaidah ketiga* ilmu ushul fiqih:'],
  [15.22, 17.96, '*Mā lā yatimmul wājibu illā bihī fahuwa wājib.*'],
  [18.28, 20.2, 'Artinya, kalau sebuah *kewajiban*'],
  [20.2, 21.75, 'tidak bisa sempurna kecuali dengan sesuatu,'],
  [21.85, 24.56, 'maka sesuatu itu hukumnya otomatis jadi *wajib*.'],
  [24.84, 26.92, 'Contoh nyatanya, di kitab *Bulughul Maram*, bab wudhu:'],
  [27.6, 29.56, 'kita wajib membasuh wajah dan tangan *sampai siku*.'],
  [29.7, 32.5, 'Masalahnya, gimana cara memastikan ujung siku terbasuh *100%*'],
  [32.5, 34.52, 'kalau nggak dilebihkan sedikit ke atas?'],
  [35.3, 37.3, 'Karena kewajiban membasuh siku nggak akan sempurna'],
  [37.3, 39.3, 'tanpa *melebihkan sedikit basuhan*,'],
  [39.46, 42.44, 'maka melebihkan basuhan itu statusnya naik menjadi *wajib*.'],
  [42.86, 44.4, 'Sama halnya dengan *buka usaha*:'],
  [44.54, 46.56, 'karena menghindari *riba* dan *akad haram* itu wajib,'],
  [46.9, 49.6, 'maka belajar *fiqih jual beli* sebelum berdagang otomatis jadi *wajib*.'],
  [49.98, 52.8, 'Jadi, jangan remehkan *sarana* menuju kewajiban ya, teman-teman.'],
  [53.28, 55.0, 'Tulis di *komentar*,'],
  [55.06, 58.06, 'hal biasa apa lagi yang berubah jadi *wajib* karena kaidah ini?'],
];

// ---------- elemen ----------
const HIJAU = '#4E8B5F', MERAH = '#E2574C', EMAS = '#F2B544';
function hexA(c, a) { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; }
function rifdaAt(T, x, a, b, arms, s = .82) {
  const rin = easeOut(prog(T, a, a + .7)), rout = easeIn(prog(T, b - .5, b));
  if (rin <= 0 || rout >= 1) return;
  drawRifda(lerp(x - 240, x, rin) - 260 * rout, 905, s, { arms, talk: talkVO(T), look: .5, label: prog(T, a + .4, a + .8) * (1 - prog(T, a + 2.6, a + 3)) });
}
function stempel(x, y, k, lab, col, size = 40, rot = -.18) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); const s = 1 + 1.4 * (1 - easeOut(clamp(k))); ctx.scale(s, s); ctx.globalAlpha = clamp(k * 3);
  ctx.font = `900 ${size}px Inter`; const w = ctx.measureText(lab).width + 40;
  ctx.fillStyle = 'rgba(255,253,247,.94)'; roundRect(-w / 2, -size * .85, w, size * 1.7, 12); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 5; ctx.stroke(); ctx.textAlign = 'center'; ctx.fillStyle = col; ctx.fillText(lab, 0, size * .36); ctx.restore();
}
function pil(x, y, k, lab, bg, fg = '#fff', size = 20) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); const s = backOut(clamp(k)); ctx.scale(s, s); ctx.globalAlpha = clamp(k * 2);
  ctx.font = `900 ${size}px Inter`; const w = ctx.measureText(lab).width + 36;
  ctx.fillStyle = bg; roundRect(-w / 2, -size * .95, w, size * 1.9, size * .95); ctx.fill();
  ctx.textAlign = 'center'; ctx.fillStyle = fg; ctx.fillText(lab, 0, size * .36); ctx.restore();
}
function ruang(T, warm = 0) {
  sky([[0, mix('#E8F1F6', '#FFF1DA', warm)], [1, mix('#C9DDE8', '#F4D9AE', warm)]]);
  particles(T, 'rgba(255,214,140,1)', 18, 19, .3);
  ctx.fillStyle = mix('#7E9FB4', '#C98E5A', warm); ctx.fillRect(0, 884, W, H); ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(0, 884, W, 4);
}
// lengan dari samping: siku di (ex, ey); air membasuh sampai batas b (0 = ujung jari .. 1 = siku, >1 = di atas siku)
function lengan(cx, cy, s, b, glowLebih = 0) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  // lengan atas + bawah
  ctx.fillStyle = '#EFC7A5'; ctx.strokeStyle = '#2A2233'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-250, -26); ctx.lineTo(40, -32); ctx.quadraticCurveTo(70, -30, 74, 0); ctx.lineTo(200, -10); ctx.lineTo(260, -4); ctx.lineTo(260, 30); ctx.lineTo(70, 34); ctx.quadraticCurveTo(40, 36, 30, 30); ctx.lineTo(-250, 26); ctx.closePath(); ctx.fill();
  // tangan (kepalan lembut)
  ctx.beginPath(); ctx.ellipse(-268, 0, 34, 30, 0, 0, 6.28); ctx.fill();
  // lengan baju
  ctx.fillStyle = '#5FA8A0'; ctx.beginPath(); ctx.moveTo(200, -24); ctx.lineTo(320, -30); ctx.lineTo(320, 44); ctx.lineTo(200, 40); ctx.closePath(); ctx.fill();
  // air: dari ujung jari sampai batas b (siku di x=50)
  const xEnd = lerp(-300, 50, Math.min(b, 1)) + Math.max(0, b - 1) * 120;
  if (b > 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(-310, -60, xEnd + 310, 120); ctx.clip();
    ctx.fillStyle = 'rgba(110,190,235,.55)'; ctx.beginPath(); ctx.moveTo(-310, -40); ctx.lineTo(320, -46); ctx.lineTo(320, 50); ctx.lineTo(-310, 42); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)'; for (let i = 0; i < 14; i++) { const x = -290 + i * 42, y = -20 + Math.sin(i * 1.7 + NT * 4) * 18; ctx.beginPath(); ctx.arc(x, y, 4, 0, 6.28); ctx.fill(); }
    ctx.restore();
    if (b > 1 && glowLebih > 0) { ctx.save(); ctx.globalAlpha = glowLebih; ctx.fillStyle = 'rgba(242,181,68,.55)'; ctx.fillRect(50, -48, xEnd - 50, 96); ctx.restore(); }
  }
  // garis siku
  ctx.strokeStyle = '#2F6247'; ctx.setLineDash([8, 7]); ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(50, -90); ctx.lineTo(50, 90); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = '900 20px Inter'; ctx.textAlign = 'center'; ctx.fillStyle = '#2F6247'; ctx.fillText('SIKU', 50, -100);
  ctx.restore();
}
// jembatan kewajiban: tebing kiri (kita) → tebing kanan (KEWAJIBAN); papan jembatan = sarana
function jembatan(T, k, gold, label = 'SARANA', target = 'KEWAJIBAN') {
  const gy = 700;
  // jurang
  const g = ctx.createLinearGradient(0, gy, 0, 1000); g.addColorStop(0, '#5A7A8C'); g.addColorStop(1, '#2A3A48'); ctx.fillStyle = g; ctx.fillRect(0, gy, W, 400);
  ctx.fillStyle = '#7E9FB4'; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(180, gy); ctx.lineTo(150, 1000); ctx.lineTo(0, 1000); ctx.fill();
  ctx.beginPath(); ctx.moveTo(W, gy); ctx.lineTo(540, gy); ctx.lineTo(570, 1000); ctx.lineTo(W, 1000); ctx.fill();
  // bendera kewajiban di tebing kanan
  ctx.fillStyle = '#5A4A3A'; ctx.fillRect(626, gy - 180, 6, 180);
  ctx.fillStyle = HIJAU; ctx.beginPath(); ctx.moveTo(632, gy - 180); ctx.lineTo(706, gy - 158); ctx.lineTo(632, gy - 136); ctx.closePath(); ctx.fill();
  pil(600, gy - 210, 1, target, HIJAU, '#fff', 18);
  // papan jembatan muncul satu per satu
  const n = 9;
  for (let i = 0; i < n; i++) {
    const a = clamp(k * (n + 2) - i); if (a <= 0) continue;
    const x = 180 + i * 40, y = gy - 4 + Math.sin(i / (n - 1) * Math.PI) * 14;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(x + 20, y - (1 - easeOut(a)) * 40);
    ctx.fillStyle = mix('#A5784F', EMAS, gold); roundRect(-19, -8, 38, 18, 4); ctx.fill();
    ctx.strokeStyle = mix('#6B4A2A', '#B07A1E', gold); ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  }
  if (k > .3) {
    ctx.save(); ctx.globalAlpha = prog(k, .3, .6); ctx.strokeStyle = mix('#6B4A2A', '#B07A1E', gold); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(180, gy - 60); ctx.quadraticCurveTo(360, gy - 20, 540, gy - 60); ctx.stroke(); ctx.restore();
    pil(360, gy + 70, prog(k, .5, .8), gold > .5 ? 'SARANA = IKUT WAJIB' : label, gold > .5 ? EMAS : '#6B4A2A', gold > .5 ? '#2A2233' : '#fff', 20);
  }
  if (gold > 0) { ctx.save(); ctx.globalAlpha = gold * .6; rays(360, gy, 30, 360, 14, 1, '255,226,150', NT * .1); ctx.restore(); }
}
function kitab(x, y, s, openK, bab) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 70, 220, 18, 0, 0, 6.28); ctx.fill();
  if (openK < .5) {
    const sc = 1 - openK * 2;
    ctx.fillStyle = '#6B2E2A'; roundRect(-120, -150, 240, 220, 10); ctx.fill();
    ctx.save(); ctx.scale(Math.max(.05, sc), 1); ctx.fillStyle = '#8C3B2E'; roundRect(-120, -160, 240, 220, 10); ctx.fill();
    ctx.strokeStyle = '#D8B25A'; ctx.lineWidth = 3; roundRect(-100, -140, 200, 180, 6); ctx.stroke();
    ctx.font = '700 34px FreeSerif'; ctx.textAlign = 'center'; ctx.fillStyle = '#F2D58A'; ctx.fillText('بُلُوغُ الْمَرَامِ', 0, -50);
    ctx.font = '800 14px Inter'; ctx.fillText('BULUGHUL MARAM', 0, -10); ctx.restore();
  } else {
    ctx.fillStyle = '#8C3B2E'; roundRect(-230, -150, 460, 220, 10); ctx.fill();
    ctx.fillStyle = '#FBF5EA'; roundRect(-220, -142, 216, 204, 6); ctx.fill(); roundRect(4, -142, 216, 204, 6); ctx.fill();
    ctx.fillStyle = 'rgba(42,34,51,.18)'; for (let i = 0; i < 6; i++) { ctx.fillRect(-200, -100 + i * 24, 176, 6); ctx.fillRect(24, -100 + i * 24, i === 5 ? 90 : 176, 6); }
    ctx.font = '800 15px Inter'; ctx.textAlign = 'center'; ctx.fillStyle = '#8C3B2E'; ctx.fillText(bab[0], -112, -118); ctx.font = '700 18px FreeSerif'; ctx.fillText(bab[1], 112, -116);
  }
  ctx.restore();
}

// ---------- adegan ----------
function S_hook(T) {
  // pembuka penuh energi: latar kontras, judul menghantam, dua contoh "mubah?" lalu dicap WAJIB
  sky([[0, '#14324A'], [1, '#1E4A5E']]);
  rays(W / 2, 420, 40, 900, 18, .25 + .3 * hookPunch(T), '120,200,255', T * .15);
  particles(T, 'rgba(200,235,255,1)', 26, 5, .8);
  ctx.fillStyle = '#10283A'; ctx.fillRect(0, 884, W, H);
  // judul menghantam di detik pertama
  const hk = backOut(prog(T, .42, .75)), hout = prog(T, 5.4, 5.8);
  if (hk > 0 && hout < 1) {
    ctx.save(); ctx.globalAlpha = 1 - hout; ctx.translate(W / 2, 250); ctx.scale(hk * (1 + .03 * Math.sin(T * 8)), hk * (1 + .03 * Math.sin(T * 8)));
    ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 20;
    ctx.font = '900 30px Inter'; ctx.fillStyle = '#fff'; ctx.fillText('JANGAN ANGGAP REMEH', 0, -40);
    ctx.font = '900 84px Inter'; ctx.fillStyle = AMBER; ctx.fillText('HAL MUBAH!', 0, 46); ctx.restore();
  }
  // dua kartu contoh muncul (5.7 & 7.6), awalnya berlabel "MUBAH?"
  [[200, 5.8, 'wudhu', 'Basuhan lebih', 'di atas siku'], [520, 7.7, 'dagang', 'Belajar ilmu', 'dagang']].forEach(([x, a, kind, l1, l2]) => {
    const k = backOut(prog(T, a, a + .4)); if (k <= 0) return;
    ctx.save(); ctx.translate(x, 470 + Math.sin(T * 2 + x) * 4); ctx.scale(k, k);
    ctx.fillStyle = '#FFFDF7'; roundRect(-130, -140, 260, 280, 26); ctx.fill();
    if (kind === 'wudhu') { ctx.save(); ctx.translate(0, -40); lengan(0, 0, .38, T > 9.8 ? 1.25 : 1.15, 0); ctx.restore(); }
    else { ctx.save(); ctx.translate(-30, -40); ctx.fillStyle = '#8C3B2E'; roundRect(-40, -40, 80, 90, 6); ctx.fill(); ctx.fillStyle = '#F2D58A'; ctx.font = '800 12px Inter'; ctx.textAlign = 'center'; ctx.fillText('FIQIH', 0, 0); ctx.fillText('MUAMALAH', 0, 16);
      [[60, 30], [86, 18], [70, 6]].forEach(([cx, cy]) => { ctx.fillStyle = EMAS; ctx.beginPath(); ctx.ellipse(cx, cy, 20, 8, 0, 0, 6.28); ctx.fill(); ctx.strokeStyle = '#B07A1E'; ctx.lineWidth = 2; ctx.stroke(); }); ctx.restore(); }
    ctx.textAlign = 'center'; ctx.font = '900 21px Inter'; ctx.fillStyle = '#2A2233'; ctx.fillText(l1, 0, 62); ctx.font = '700 17px Inter'; ctx.fillStyle = '#7A6A5C'; ctx.fillText(l2, 0, 88);
    ctx.restore();
    // label "MUBAH?" lalu dicap "WAJIB!" saat hantaman 9.8
    if (T < 9.8) pil(x, 320, prog(T, a + .3, a + .6), 'MUBAH?', '#7A6A5C', '#fff', 20);
    stempel(x, 330, prog(T, 9.8, 10.05), 'WAJIB!', MERAH, 38, x < 360 ? -.16 : .14);
  });
  // "KOK BISA?" meloncat
  const kb = backOut(prog(T, 11.74, 12.0));
  if (kb > 0) { ctx.save(); ctx.translate(W / 2, 720); ctx.scale(kb, kb); ctx.rotate(-.05); ctx.fillStyle = AMBER; roundRect(-170, -48, 340, 96, 30); ctx.fill(); ctx.font = '900 52px Inter'; ctx.textAlign = 'center'; ctx.fillStyle = '#14324A'; ctx.fillText('KOK BISA?', 0, 18); ctx.restore(); }
  // Rifda menyapa di detik awal
  const rin = easeOut(prog(T, .5, 1.2)), rout = easeIn(prog(T, 5.0, 5.5));
  if (rout < 1) drawRifda(lerp(-140, 130, rin) - rout * 300, 905, 1.0, { arms: 'point', talk: talkVO(T), label: prog(T, 1, 1.4) * (1 - prog(T, 4, 4.4)), look: .5 });
}
function S_kaidah(T) {
  ruang(T, .6);
  const g = ctx.createRadialGradient(W / 2, 470, 30, W / 2, 470, 460); g.addColorStop(0, 'rgba(255,236,180,.6)'); g.addColorStop(1, 'rgba(255,236,180,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  rays(W / 2, 470, 60, 620, 14, .35 * prog(T, 15.2, 16.2), '255,226,150', T * .08);
  headline('RAHASIANYA DI', ['KAIDAH KETIGA', 'USHUL FIQIH'], T, 12.7, 0, { y: 150, size: 46, bigColor: B.daunGelap, smallColor: '#7A6A5C' });
  dalilCard(T, 15.1, 'KAIDAH USHUL FIQIH', ['مَا لَا يَتِمُّ الْوَاجِبُ إِلَّا بِهِ', 'فَهُوَ وَاجِبٌ'], ['“Sesuatu yang membuat kewajiban tidak sempurna', 'kecuali dengannya, maka ia ikut wajib.”'], 'Kaidah ushul fiqih',
    { y: 350, h: 340, arabSize: 42, bg: 'rgba(35,69,54,.95)' });
  rifdaAt(T, 92, 12.7, 18.1, 'chest');
}
function S_jembatan(T) {
  sky([[0, '#FFF1DA'], [1, '#CFE2EC']]);
  particles(T, 'rgba(255,214,140,1)', 16, 29, .3);
  headline('PERUMPAMAANNYA', ['JEMBATAN', 'KEWAJIBAN'], T, 18.4, 0, { y: 140, size: 50, bigColor: '#2A4C38', smallColor: '#7A6A5C' });
  jembatan(T, easeOut(prog(T, 19.0, 21.4)), easeInOut(prog(T, 22.6, 23.4)));
  // Dafa di tebing kiri menyeberang setelah jembatan menyala
  const walk = easeInOut(prog(T, 23.0, 24.6));
  drawDafa(lerp(100, 300, walk), 700 - Math.sin(walk * Math.PI) * 14, .75, { t: T, mood: 1, look: .5, arms: walk > .9 ? 'lift' : 'rest', up: walk > .9 ? 1 : 0, target: 'cheer' });
  stempel(360, 570, prog(T, 22.5, 22.75), 'WAJIB', HIJAU, 32, -.08);
}
function S_wudhu(T) {
  ruang(T, .1);
  const bk = backOut(prog(T, 24.9, 25.4)), open = prog(T, 25.7, 26.5), kout = prog(T, 27.2, 27.6);
  if (kout < 1) { ctx.save(); ctx.globalAlpha = 1 - kout; kitab(W / 2, 560, bk, open, ['BAB WUDHU', 'بَابُ الْوُضُوءِ']); ctx.restore(); }
  headline('CONTOH NYATA', ['BAB WUDHU'], T, 24.95, 27.4, { y: 150, size: 54, bigColor: '#1E4A5E', smallColor: '#5F7A88' });
  dalilCard(T, 27.5, 'QS. AL-MA’IDAH: 6', ['فَاغْسِلُوا وُجُوهَكُمْ', 'وَأَيْدِيَكُمْ إِلَى الْمَرَافِقِ'], ['“… maka basuhlah mukamu dan tanganmu', 'sampai dengan siku …”'], 'Terjemahan Kemenag RI',
    { y: 120, h: 330, arabSize: 40, bg: 'rgba(30,74,94,.95)' });
  // lengan dibasuh: sampai siku → ragu (100%?) → dilebihkan sedikit → bagian lebih jadi WAJIB
  if (T > 28) {
    const b = T < 35.3 ? 1 * easeOut(prog(T, 28.2, 29.6)) : 1 + .3 * easeInOut(prog(T, 35.6, 37.2));
    const lk = easeOut(prog(T, 28.0, 28.5));
    ctx.save(); ctx.globalAlpha = lk; lengan(370, 650, 1.0, b, prog(T, 39.5, 40.2)); ctx.restore();
    // ujung siku: tanda tanya 100%?
    const q = backOut(prog(T, 30.7, 31.1)) * (1 - prog(T, 36.6, 37.0));
    if (q > 0) pil(370 + 50, 540, q, 'TERBASUH 100%?', '#8C3B2E', '#fff', 20);
    pil(370 + 120, 770, prog(T, 37.4, 37.8), 'lebihkan sedikit', '#5F7A88', '#fff', 18);
    stempel(370 + 110, 540, prog(T, 39.5, 39.75), 'IKUT WAJIB', HIJAU, 32, -.1);
  }
}
function S_dagang(T) {
  sky([[0, '#FFF1DA'], [1, '#F4D9AE']]);
  particles(T, 'rgba(255,200,120,1)', 14, 41, .3);
  ctx.fillStyle = '#C98E5A'; ctx.fillRect(0, 884, W, H);
  headline('SAMA HALNYA', ['BUKA USAHA'], T, 42.95, 0, { y: 150, size: 56, bigColor: '#8C3B2E', smallColor: '#7A6A5C' });
  // lapak dagang
  const lk = backOut(prog(T, 43.0, 43.5));
  ctx.save(); ctx.translate(440, 884); ctx.scale(lk, lk);
  ctx.fillStyle = '#8C5A3C'; ctx.fillRect(-150, -170, 300, 170); ctx.fillStyle = '#A5784F'; ctx.fillRect(-160, -180, 320, 20);
  for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? '#E2574C' : '#FFFDF7'; ctx.beginPath(); ctx.moveTo(-170 + i * 57, -300); ctx.lineTo(-170 + (i + 1) * 57, -300); ctx.lineTo(-170 + (i + 1) * 57, -260); ctx.quadraticCurveTo(-170 + (i + .5) * 57, -240, -170 + i * 57, -260); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = '#5A3B2A'; ctx.fillRect(-150, -300, 8, 130); ctx.fillRect(142, -300, 8, 130);
  [[-90, '#F2B544'], [-30, '#E2574C'], [30, '#4E8B5F'], [90, '#B9A6E0']].forEach(([x, c]) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, -196, 18, 0, 6.28); ctx.fill(); });
  ctx.restore();
  drawDafa(170, 882, .9, { t: T, mood: .8, arms: T > 47 ? 'lift' : 'point', up: 1, target: 'hold', look: .4 });
  // riba & akad haram dicoret
  [['RIBA', 44.9, 300], ['AKAD HARAM', 45.6, 370]].forEach(([l, a, y]) => {
    const k = backOut(prog(T, a, a + .35)); if (k <= 0) return;
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(k, k); ctx.font = '900 30px Inter'; const w = ctx.measureText(l).width + 40;
    ctx.fillStyle = 'rgba(140,59,46,.12)'; roundRect(-w / 2, -28, w, 52, 14); ctx.fill(); ctx.textAlign = 'center'; ctx.fillStyle = '#8C3B2E'; ctx.fillText(l, 0, 10);
    const c = prog(T, a + .4, a + .7); ctx.strokeStyle = MERAH; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-w / 2, 0); ctx.lineTo(-w / 2 + w * c, -2); ctx.stroke(); ctx.restore();
  });
  // buku fiqih jual beli menyala → wajib
  const fk = backOut(prog(T, 47.0, 47.4));
  if (fk > 0) {
