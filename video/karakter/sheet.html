<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#F6EFE3}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="2160"></canvas>
<script src="karakter.js"></script>
<script>
const cv = document.getElementById('c'); ctx = cv.getContext('2d');
const W = 1920, H = 2160;
// ---------- tata letak lembar ----------
function txt(s, x, y, size, weight = 700, color = INK, align = 'left', font = 'Inter') {
  ctx.font = `${weight} ${size}px ${font}, sans-serif`; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(s, x, y);
}
function card(x, y, w, h, bg = '#FFFFFF') {
  ctx.save(); ctx.shadowColor = 'rgba(80,50,30,.12)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x, y, w, h, 28); ctx.fill(); ctx.restore();
}
function floor(x, y, w) { ctx.strokeStyle = 'rgba(80,50,30,.15)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.stroke(); }
function sajadah(x, y, w) { ctx.fillStyle = '#2F6B5B'; ctx.beginPath(); ctx.roundRect(x, y - 4, w, 12, 4); ctx.fill(); ctx.fillStyle = '#D8B25A'; ctx.fillRect(x + 6, y - 1, w - 12, 2); }

ctx.fillStyle = '#F6EFE3'; ctx.fillRect(0, 0, W, H);
txt('LEMBAR UJI DESAIN KARAKTER · GAYA B', 80, 100, 22, 700, '#9A7B62');
txt('Kepala bulat, badan = jubah', 80, 160, 56, 900);

// Baris 1: Rifda
const RIFDA = { robe: '#B9A6E0', wear: 'hijab', hijab: '#F29BB8' };
card(60, 210, 1800, 600);
txt('1 · Rifda (narator)', 110, 280, 34, 800);
txt('Kerudung pink, jubah ungu muda. Muncul hanya di pembuka, pengantar dalil, penjelasan, dan penutup.', 110, 322, 22, 500, '#6E5A4C');
[['diam', 'fold'], ['menunjuk', 'point'], ['melambai', 'wave']].forEach(([label, arms], i) => {
  const cx = 300 + i * 360; floor(cx - 130, 720, 260);
  figure(cx, 720, 1.85, { ...RIFDA, pose: 'stand', arms, mood: arms === 'fold' ? .7 : 1 });
  txt(label, cx, 770, 24, 700, '#6E5A4C', 'center');
});
// label nama Arab + palet
ctx.save(); ctx.fillStyle = '#F29BB8'; ctx.beginPath(); ctx.roundRect(1300, 400, 440, 150, 75); ctx.fill(); ctx.restore();
txt('رِفْدَة', 1520, 497, 78, 700, '#FFFFFF', 'center', 'FreeSerif');
txt('Rifda · label nama saat muncul', 1520, 590, 22, 600, '#6E5A4C', 'center');
[['#F29BB8', 'kerudung'], ['#B9A6E0', 'jubah'], ['#EFC7A5', 'kulit']].forEach(([c, l], i) => {
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(1370 + i * 150, 670, 34, 0, 6.28); ctx.fill();
  txt(l, 1370 + i * 150, 735, 20, 600, '#6E5A4C', 'center'); txt(c, 1370 + i * 150, 760, 16, 500, '#9A7B62', 'center');
});

// Baris 2: pose shalat
const MAN = { robe: '#F1EADB', wear: 'kopiah', beard: '#3A2A22' };
card(60, 850, 1800, 560);
txt('2 · Pose shalat (uji sujud)', 110, 920, 34, 800);
txt('Pose kunci digambar satu per satu; animasi bergerak halus di antaranya. Jubah = bentuk badan, jadi tidak perlu dilipat.', 110, 962, 22, 500, '#6E5A4C');
[['berdiri', 'stand'], ['rukuk', 'ruku'], ['sujud', 'sujud'], ['duduk', 'duduk']].forEach(([label, pose], i) => {
  const cx = 310 + i * 420 - (pose === 'ruku' ? 40 : 0) + (pose === 'sujud' ? 20 : 0);
  sajadah(cx - 150 + (pose === 'ruku' ? 40 : 0), 1330, 300);
  figure(cx, 1328, 1.75, { ...MAN, pose, arms: pose === 'stand' ? 'fold' : 'rest', mood: .6 });
  txt(label, 310 + i * 420, 1385, 24, 700, '#6E5A4C', 'center');
});

// Baris 3: kostum
card(60, 1450, 1800, 650);
txt('3 · Satu gaya, kostum menyesuaikan konteks', 110, 1520, 34, 800);
txt('Kisah masa lalu (sahabat, orang saleh) memakai siluet tanpa wajah.', 110, 1562, 22, 500, '#6E5A4C');
const COST = [
  ['rumah', { robe: '#5FA8A0', wear: 'kopiah', capColor: '#2B2B33', costume: 'rumah', arms: 'rest' }],
  ['perang', { robe: '#9A3B3B', wear: 'helmet', costume: 'zirah', arms: 'spear', beard: '#3A2A22' }],
  ['pasar', { robe: '#8C6B4A', wear: 'sorban', costume: 'pasar', arms: 'basket', beard: '#3A2A22' }],
  ['siluet (kisah masa lalu)', { robe: '#9A3B3B', wear: 'sorban', arms: 'spear', sil: '#2A2238', rim: 1 }],
];
COST.forEach(([label, o], i) => {
  const cx = 300 + i * 420;
  if (o.sil) {
    const g = ctx.createLinearGradient(0, 1600, 0, 2000); g.addColorStop(0, '#F7B27A'); g.addColorStop(1, '#E77E6B');
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(cx - 170, 1600, 340, 410, 22); ctx.fill();
  }
  floor(cx - 130, 1990, 260);
  figure(cx, 1990, 1.75, { pose: 'stand', mood: .8, ...o });
  txt(label, cx, 2050, 24, 700, '#6E5A4C', 'center');
});
</script>
</body></html>
