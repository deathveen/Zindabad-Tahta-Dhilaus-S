<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#FBF5EA}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="3080"></canvas>
<script src="../karakter/karakter.js"></script>
<script src="brand.js"></script>
<script>
// Lembar konsep visual akun "Faedah Harian".
const cv = document.getElementById('c'); ctx = cv.getContext('2d');
const W = 1920, H = 3080;

// Label pilar berwarna netral; warna adegan/cover mengikuti isi konten, bukan pilarnya.
const PILAR = [
  // label, ikon, contoh judul, latar cover (mengikuti suasana isi), aksen
  ['KAIDAH', 'kunci', 'Yakin tidak hilang karena ragu', '#EEF1E6', '#8DB39A'],
  ['HUKUM', 'timbangan', 'Bolehkah menegur makanan basi?', '#FBE9DA', '#E9A27C'],
  ['ADAB', 'hati', 'Adab makan: mulai dari kanan', '#FDF1E4', '#F2B544'],
  ['KISAH', 'buku', 'Pemilik dua kebun yang lupa diri', '#E7F0DC', '#6FA35F'],
  ['PSIKOLOGI', 'otak', 'Kenapa satu kritik terasa lebih berat?', '#F4EEFA', '#B9A6E0'],
];
const PILL_C = B.daunGelap;
// ---------- tata letak ----------
function txt(s, x, y, size, weight = 700, color = B.tinta, align = 'left', font = 'Inter') {
  ctx.font = `${weight} ${size}px ${font}, sans-serif`; ctx.fillStyle = color; ctx.textAlign = align; ctx.fillText(s, x, y);
}
function wrap(s, x, y, maxW, size, weight, color, lh = 1.15, align = 'left') {
  ctx.font = `${weight} ${size}px Inter`; const words = s.split(' '); let line = '', yy = y;
  words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { txt(line, x, yy, size, weight, color, align); line = w; yy += size * lh; } else line = t; });
  txt(line, x, yy, size, weight, color, align); return yy;
}
function card(x, y, w, h, bg = '#FFFFFF') {
  ctx.save(); ctx.shadowColor = 'rgba(60,50,30,.10)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 6;
  ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(x, y, w, h, 28); ctx.fill(); ctx.restore();
}
function section(n, title, sub, y) { txt(`${n} · ${title}`, 110, y, 34, 800); if (sub) txt(sub, 110, y + 42, 22, 500, B.abu); }
function phone(x, y, w, h, draw) {
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.18)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#1b1b1f'; ctx.beginPath(); ctx.roundRect(x - 10, y - 10, w + 20, h + 20, 34); ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, 26); ctx.clip(); ctx.translate(x, y); draw(w, h); ctx.restore();
}

ctx.fillStyle = B.krem; ctx.fillRect(0, 0, W, H);
txt('KONSEP VISUAL AKUN', 80, 100, 22, 700, '#9A7B62');
txt('Faedah Harian', 80, 168, 64, 900, B.daunGelap);
txt('Bertumbuh lewat satu faedah setiap hari: tunas (bertumbuh) + fajar (harian) + Rifda (teman belajar).', 80, 214, 24, 500, B.abu);

// 1. Logo
card(60, 260, 1800, 640);
section(1, 'Logo', 'B = foto profil & wajah akun · A = watermark & aset kecil · C = edisi khusus (mis. Ramadan).', 330);
// A
iconA(330, 570, 120);
wordmark(330, 770, 40, { align: 'center' });
txt('A · Tunas Fajar', 330, 868, 22, 700, B.abu, 'center');
// B
iconB(920, 570, 120);
wordmark(920, 770, 40, { align: 'center' });
txt('B · Rifda + Tunas', 920, 868, 22, 700, B.abu, 'center');
// C
ctx.save(); ctx.fillStyle = B.daunGelap; ctx.beginPath(); ctx.roundRect(1330, 440, 400, 270, 40); ctx.fill(); ctx.restore();
sunrise(1530, 545, 34);
sprout(1530, 548, .7, '#8BD17C', '#8BD17C');
txt('فَائِدَة يَوْمِيَّة', 1530, 640, 58, 700, B.fajar, 'center', 'FreeSerif');
txt('faedah harian', 1530, 690, 28, 700, '#F6EBD5', 'center');
txt('C · Sentuhan Arab', 1530, 868, 22, 700, B.abu, 'center');

// 2. Palet
card(60, 940, 1800, 400);
section(2, 'Palet identitas', 'Hijau daun = bertumbuh, amber = fajar/harian, krem = latar hangat. Pink & ungu milik Rifda.', 1010);
[['Daun', B.daun], ['Daun Gelap', B.daunGelap], ['Fajar', B.fajar], ['Krem', B.krem], ['Kerudung Rifda', B.pink], ['Jubah Rifda', B.ungu]].forEach(([n, c], i) => {
  const x = 200 + i * 280;
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, 1180, 62, 0, 6.28); ctx.fill();
  if (c === B.krem) { ctx.strokeStyle = '#E3D6BE'; ctx.lineWidth = 3; ctx.stroke(); }
  txt(n, x, 1282, 22, 700, B.tinta, 'center'); txt(c, x, 1310, 18, 500, B.abu, 'center');
});

// 3. Lima pilar
card(60, 1380, 1800, 330);
section(3, 'Lima pilar konten', 'Label pilar berwarna netral. Warna adegan & cover selalu mengikuti isi konten (kisah gurun = warna pasir).', 1450);
let px = 110; PILAR.forEach(([l, ic]) => { px += pill(l, PILL_C, ic, px, 1560, 1.35) + 30; });
txt('Feed tetap rapi lewat label, logo, dan Rifda yang konsisten, bukan lewat warna yang dipaksakan.', 110, 1665, 22, 500, B.abu);

// 4. Penerapan
card(60, 1750, 1800, 1260);
section(4, 'Penerapan', 'Cover Reels · watermark di video · kartu penutup · foto profil', 1820);
const PW = 360, PH = 640, PY = 1920;
// cover
phone(140, PY, PW, PH, (w, h) => {
  const [l, ic, title, bg, ac] = PILAR[2];
  ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = shade(ac, .6); ctx.beginPath(); ctx.arc(w * .8, h * .78, 220, 0, 6.28); ctx.fill();
  iconB(44, 52, 22); txt('faedah harian', 74, 59, 17, 800, B.daunGelap);
  pill(l, PILL_C, ic, 26, 150, 1);
  wrap(title, 26, 240, w - 52, 40, 900, B.daunGelap, 1.1);
  figure(w * .72, h - 40, 1.25, { pose: 'stand', arms: 'point', robe: B.ungu, wear: 'hijab', hijab: B.pink });
  ctx.fillStyle = ac; ctx.fillRect(0, h - 10, w, 10);
});
txt('Cover Reels', 140 + PW / 2, PY + PH + 50, 22, 700, B.abu, 'center');
// watermark di adegan
phone(560 + 20, PY, PW, PH, (w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#5B3F8C'); g.addColorStop(.55, '#E98A72'); g.addColorStop(.75, '#FFD39A'); ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#2E2440'; ctx.beginPath(); ctx.moveTo(0, h * .7); ctx.quadraticCurveTo(w / 2, h * .66, w, h * .7); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill();
  figure(w * .5, h * .7, 1.1, { pose: 'stand', arms: 'fold', robe: '#F1EADB', wear: 'kopiah', beard: '#3A2A22', mood: .6 });
  txt('Ini caption contoh.', w / 2, h * .8, 22, 800, '#fff', 'center');
  ctx.save(); ctx.globalAlpha = .55; sprout(26, 50, .32, '#fff', '#fff'); txt('faedahharian.official', 42, 46, 15, 800, '#fff'); ctx.restore();
});
txt('Watermark (pojok kiri atas, 55%)', 580 + PW / 2, PY + PH + 50, 22, 700, B.abu, 'center');
// kartu penutup
phone(1000 + 40, PY, PW, PH, (w, h) => {
  ctx.fillStyle = B.daunGelap; ctx.fillRect(0, 0, w, h);
  const gy = 470;
  sunrise(w / 2, gy, 110, 'rgba(242,181,68,.22)');
  ctx.fillStyle = shade(B.daunGelap, .12); ctx.fillRect(0, gy, w, h);
  figure(w / 2, gy + 4, 1.2, { pose: 'stand', arms: 'wave', robe: B.ungu, wear: 'hijab', hijab: B.pink });
  iconB(w / 2, 70, 38);
  txt('Follow', w / 2, 152, 24, 600, '#F6EBD5', 'center');
  txt(HANDLE, w / 2, 192, 26, 900, B.fajar, 'center');
  txt('teman belajar & pengingat harianmu', w / 2, gy + 44, 17, 600, '#F6EBD5', 'center');
  ctx.fillStyle = B.fajar; ctx.beginPath(); ctx.roundRect(w / 2 - 80, h - 92, 160, 42, 21); ctx.fill();
  txt('+ Follow', w / 2, h - 64, 19, 800, B.daunGelap, 'center');
});
txt('Kartu penutup (Rifda)', 1040 + PW / 2, PY + PH + 50, 22, 700, B.abu, 'center');
// foto profil
const AX = 1640;
iconB(AX, 2080, 110); txt('Foto profil (B) ✓', AX, 2225, 20, 800, B.daunGelap, 'center');
iconA(AX, 2420, 110); txt('Logo A: watermark & aset', AX, 2565, 20, 700, B.abu, 'center');
[[1555, 60], [1680, 40], [1762, 24]].forEach(([x, r]) => iconB(x, 2700, r));
txt('ukuran kecil di feed & komentar', AX, 2790, 18, 500, B.abu, 'center');

// grid feed
txt('Contoh feed (warna mengikuti isi)', 140, 2690, 24, 800, B.tinta);
PILAR.concat([PILAR[0]]).forEach(([l, ic, title, bg, c], i) => {
  const x = 140 + i * 228, y = 2720, w = 210, h = 260;
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.clip();
  ctx.fillStyle = bg; ctx.fillRect(x, y, w, h); ctx.fillStyle = shade(c, .55); ctx.beginPath(); ctx.arc(x + w * .85, y + h * .85, 110, 0, 6.28); ctx.fill();
  ctx.fillStyle = c; ctx.fillRect(x, y + h - 8, w, 8);
  pill(l, PILL_C, ic, x + 12, y + 14, .62);
  wrap(title, x + 12, y + 70, w - 24, 21, 900, B.daunGelap, 1.12);
  ctx.restore();
});
</script>
</body></html>
